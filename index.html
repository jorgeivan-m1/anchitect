<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mapa de barrios de Popayán por comuna</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        /* Variables de tema claro (por defecto) */
        :root {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --input-bg: #ffffff;
            --input-border: #d1d5db;
            --btn-primary-bg: #2563eb;
            --btn-primary-hover: #1d4ed8;
            --btn-primary-text: #ffffff;
            --btn-secondary-bg: #e5e7eb;
            --btn-secondary-hover: #d1d5db;
            --btn-secondary-text: #1f2937;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -1px rgb(0 0 0 / 0.06);
            --badge-bg: #eff6ff;
            --badge-text: #1e40af;
        }

        /* Tema oscuro */
        body.dark {
            --bg-body: #111827;
            --bg-card: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #e5e7eb;
            --text-muted: #9ca3af;
            --border: #374151;
            --input-bg: #374151;
            --input-border: #4b5563;
            --btn-primary-bg: #3b82f6;
            --btn-primary-hover: #2563eb;
            --btn-primary-text: #ffffff;
            --btn-secondary-bg: #374151;
            --btn-secondary-hover: #4b5563;
            --btn-secondary-text: #f9fafb;
            --badge-bg: #1e3a8a;
            --badge-text: #bfdbfe;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Header con el botón de tema */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .theme-toggle {
            background: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .theme-toggle:hover {
            background: var(--btn-secondary-hover);
            transform: scale(1.02);
        }

        /* Tarjeta principal */
        .card {
            background: var(--bg-card);
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        /* Grupos de búsqueda y filtro */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 640px) {
            .controls {
                flex-direction: row;
            }
            .controls > * {
                flex: 1;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input, select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #3b82f6;
            ring: 2px solid #3b82f6;
        }

        button {
            background: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            border: none;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-size: 1rem;
        }

        button:hover {
            background: var(--btn-primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Resultados */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .barrio-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .barrio-item {
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            cursor: pointer;
        }

        .barrio-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
            border-color: #3b82f6;
        }

        .barrio-name {
            font-weight: 500;
        }

        .comuna-badge {
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        hr {
            border-color: var(--border);
            margin: 1rem 0;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }

        /* scroll personalizado */
        .barrio-list::-webkit-scrollbar {
            width: 6px;
        }
        .barrio-list::-webkit-scrollbar-track {
            background: var(--border);
            border-radius: 10px;
        }
        .barrio-list::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 10px;
        }
    </style>
</head>

</div>

    }));

    // Elementos del DOM
    const searchInput = document.getElementById('searchInput');
    const comunaFilter = document.getElementById('comunaFilter');
    const clearBtn = document.getElementById('clearFilters');
    const barriosContainer = document.getElementById('barriosContainer');
    const resultCountSpan = document.getElementById('resultCount');

    // Función para renderizar los barrios
    function renderBarrios(filteredBarrios) {
        if (filteredBarrios.length === 0) {
            barriosContainer.innerHTML = `<div class="no-results">❌ No se encontraron barrios. Intenta con otro nombre o comuna.</div>`;
            resultCountSpan.textContent = `0 barrios encontrados`;
            return;
        }

        const html = filteredBarrios.map(barrio => `
            <div class="barrio-item">
                <span class="barrio-name">🏘️ ${barrio.nombre}</span>
                <span class="comuna-badge">Comuna ${barrio.comuna}</span>
            </div>
        `).join('');
        
        barriosContainer.innerHTML = html;
        resultCountSpan.textContent = `${filteredBarrios.length} barrio${filteredBarrios.length !== 1 ? 's' : ''} encontrado${filteredBarrios.length !== 1 ? 's' : ''}`;
    }

    // Función de filtrado
    function filterBarrios() {
        const searchTerm = searchInput.value.trim().toLowerCase();
        const selectedComuna = comunaFilter.value;

        let filtered = [...barrios];

        if (selectedComuna !== 'all') {
            filtered = filtered.filter(barrio => barrio.comuna === selectedComuna);
        }

        if (searchTerm !== '') {
            filtered = filtered.filter(barrio => barrio.nombre.toLowerCase().includes(searchTerm));
        }

        // Orden alfabético
        filtered.sort((a, b) => a.nombre.localeCompare(b.nombre));
        renderBarrios(filtered);
    }

    // Event listeners
    searchInput.addEventListener('input', filterBarrios);
    comunaFilter.addEventListener('change', filterBarrios);
    clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        comunaFilter.value = 'all';
        filterBarrios();
    });

    // Tema oscuro/claro
    const themeToggle = document.getElementById('themeToggle');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    function setTheme(isDark) {
        if (isDark) {
            document.body.classList.add('dark');
            themeToggle.innerHTML = '☀️ Modo claro';
        } else {
            document.body.classList.remove('dark');
            themeToggle.innerHTML = '🌙 Modo oscuro';
        }
    }
    
    // Cargar tema guardado o preferencia del sistema
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
        setTheme(true);
    } else if (savedTheme === 'light') {
        setTheme(false);
    } else {
        setTheme(prefersDark);
    }
    
    themeToggle.addEventListener('click', () => {
        const isDark = document.body.classList.contains('dark');
        setTheme(!isDark);
        localStorage.setItem('theme', !isDark ? 'dark' : 'light');
    });

    // Render inicial
    filterBarrios();
